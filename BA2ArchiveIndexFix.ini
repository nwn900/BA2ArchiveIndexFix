[BA2 Archive Index Fix]
; Experimental, exact-profile recovery for Fallout 4 1.10.163.
; Use a separate test profile and copied saves until live-game validation is complete.
; See README.md and docs/validation.md.

; Disable all hooks with Enabled=0.
Enabled=1

; Rebuild only a verified archive index with complete, unambiguous membership.
; Failed guards leave the original engine behavior in place, including a possible hang.
Fix=1

; Optional passive read-lock diagnostics. This adds a frequently called hook.
; It never clears a lock, repairs memory, or parks a writer.
MonitorLockWaits=0

; Only used by the passive wait monitor. Clamped to 1000..60000 milliseconds.
StallMilliseconds=3000

; Diagnostic event-drain / monitor interval. Clamped to 50..5000 milliseconds.
PollMilliseconds=250

; BreakMilliseconds, WriterCpuPercent, and SpinSamples were removed.
; Existing values for those keys are logged and ignored.
